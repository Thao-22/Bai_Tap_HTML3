<!DOCTYPE html>
<html><head>
<meta charset=utf-8 />
<title>Return first and last name from a form</title>
</head><body>
<form id="form1" onsubmit="getFormvalue()">
First name: <input type="text" name="fname" value="David" id="fn"><br>
Last name: <input type="text" name="lname" value="Beckham" id='ln'><br>
<input type="submit" value="Submit">
</form>
<p id="result"></p>
<script>
    function getFormvalue(){
        var firstname = document.getElementById('fn').value;
        var lastname = document.getElementById('ln').value;

        var fullname= firstname + " " + lastname;

        console.log("Ho ten day du: ", fullname);
        document.getElementById('result').innerText="Ho ten day du: " + fullname;
    }
</script>
</body>
</html>
