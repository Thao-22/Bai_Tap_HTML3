<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Return first and last name from a form</title>
    <!-- Nhúng thư viện jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<form id="form1">
    First name: <input type="text" name="fname" value="David"><br>
    Last name: <input type="text" name="lname" value="Beckham"><br>
    <input type="submit" value="Submit">
</form>

<p id="result"></p>

<script>
    $(document).ready(function() {
        // Bắt sự kiện submit của form bằng jQuery
        $('#form1').submit(function(event) {
            // Chặn hành vi reload lại trang mặc định của form
            event.preventDefault();

            // 1. Lấy giá trị bằng jQuery (Dựa theo thuộc tính name)
            var firstNameQuery = $('input[name="fname"]').val();
            var lastNameQuery = $('input[name="lname"]').val();

            // Ghép họ và tên
            var fullName = firstNameQuery + " " + lastNameQuery;

            // In ra console kiểm tra
            console.log("Họ tên (jQuery):", fullName);

            // Hiển thị kết quả ra thẻ <p id="result"> bằng jQuery
            $('#result').text("Họ tên đầy đủ: " + fullName);
        });
    });
</script>

</body>
</html>
